# Alembic — football history warehouse
# Run from repository root, e.g.:
#   export FOOTBALL_WAREHOUSE_DATABASE_URL="postgresql+psycopg://..."
#   alembic -c football_history_warehouse/storage/database/migrations/alembic.ini upgrade head
#
# The URL is overridden from the environment in env.py (do not put secrets here).

[alembic]
script_location = %(here)s
prepend_sys_path = ../../../..
path_separator = os
version_path_separator = os

# Placeholder only; env.py sets the real URL from FOOTBALL_WAREHOUSE_DATABASE_URL
sqlalchemy.url = driver://user:pass@localhost/dbname

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
